url: https://lab-tecnosocial.github.io/censosbo/

repo:
  url:
    home: https://github.com/lab-tecnosocial/censosbo
    source: https://github.com/lab-tecnosocial/censosbo/blob/main/
    issue: https://github.com/lab-tecnosocial/censosbo/issues/
    user: https://github.com/

template:
  bootstrap: 5
  bslib:
    primary: "#003087"
    link-color: "#003087"
    heading-font: "Source Sans Pro"

home:
  title: "censosbo: Censos de Bolivia (1976–2024)"
  description: >
    Acceso programático a los microdatos de todos los censos de Bolivia:
    1976, 1992, 2001, 2012 y CPV-2024. Descarga bajo demanda, caché local,
    compatible con dplyr, Arrow y DuckDB. Incluye funciones de análisis
    longitudinal y diccionarios de variables para todos los años.
  sidebar:
    structure: [links, license, community, citation, authors, dev]
  links:
  - text: "Fuente de datos: INE Bolivia"
    href: https://anda.ine.gob.bo
  - text: "Reportar un problema"
    href: https://github.com/lab-tecnosocial/censosbo/issues

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Empezar
      href: articles/introduccion.html
    reference:
      text: Referencia
      href: reference/index.html
    news:
      text: Noticias
      href: news/index.html
    articles:
      text: Artículos
      menu:
      - text: "Introducción al paquete"
        href: articles/introduccion.html
      - text: "Diccionario de datos (1976–2024)"
        href: articles/diccionario.html
      - text: "---"
      - text: "Censos históricos"
      - text: "Acceso a censos históricos (1976–2012)"
        href: articles/censos-historicos.html
      - text: "Análisis longitudinal entre censos"
        href: articles/analisis-longitudinal.html
      - text: "---"
      - text: "Tutoriales CPV-2024"
      - text: "Análisis demográfico"
        href: articles/analisis-demografico.html
      - text: "Análisis de condiciones de vivienda"
        href: articles/analisis-vivienda.html
      - text: "Análisis avanzado con DuckDB y Arrow"
        href: articles/analisis-avanzado.html

footer:
  left: "Desarrollado por [Alex Ojeda Copa](https://labtecnosocial.org)."
  right: "Sitio construido con [pkgdown](https://pkgdown.r-lib.org/)."

reference:
  - title: "CPV-2024: microdatos"
    desc: >
      Funciones para descargar y consultar los microdatos del Censo de
      Población y Vivienda 2024. Todos devuelven un Arrow Dataset (lazy),
      un tibble, o una conexión DuckDB.
    contents:
      - get_personas_2024
      - get_viviendas_2024
      - get_emigracion_2024
      - get_mortalidad_2024

  - title: "Censos históricos: API general"
    desc: >
      Función principal para acceder a cualquier censo histórico (1976,
      1992, 2001, 2012) y funciones de análisis longitudinal entre censos.
    contents:
      - get_censo
      - get_longitudinal
      - get_longitudinal_vivienda
      - variables_armonizadas
      - grupos_variables

  - title: "Censos históricos: atajos por año"
    desc: >
      Funciones cortas equivalentes a `get_censo(anio, tabla, ...)`.
    contents:
      - get_poblacion_1976
      - get_viviendas_1976
      - get_personas_1992
      - get_viviendas_1992
      - get_mortalidad_1992
      - get_personas_2001
      - get_viviendas_2001
      - get_personas_2012
      - get_viviendas_2012
      - get_emigracion_2012
      - get_discapacidad_2012

  - title: "Diccionario de variables"
    desc: >
      Funciones para explorar variables y etiquetas de todos los censos,
      y para convertir códigos numéricos a texto legible.
    contents:
      - codebook
      - codebook_valores
      - codebook_1976
      - codebook_1992
      - codebook_2001
      - codebook_2012
      - codebook_2024
      - etiquetar_valores
      - etiquetar_variables

  - title: "Geografía y visualización en mapas"
    desc: >
      Funciones para consultar la división político-administrativa del país
      y para generar mapas coropléticos con variables censales.
    contents:
      - departamentos
      - provincias
      - municipios
      - mapa_dep
      - mapa_mun
      - mapa_man

  - title: "Gestión de caché"
    desc: >
      Los archivos Parquet se descargan una sola vez y quedan en caché local.
    contents:
      - censosbo_cache_dir
      - censosbo_cache_info
      - censosbo_cache_clear

  - title: "Datos incluidos en el paquete"
    desc: >
      Datasets disponibles sin descarga, incluidos directamente en el paquete.
    contents:
      - codebook_meta
      - codebook_historico_meta
      - variable_longitudinal_map
      - geo_bolivia
      - geo_departamentos
      - geo_municipios

  - title: "Información del paquete"
    contents:
      - censosbo-package

