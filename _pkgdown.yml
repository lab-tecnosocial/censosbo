url: https://lab-tecnosocial.github.io/censosbo/

repo:
  url:
    home: https://github.com/lab-tecnosocial/censosbo
    source: https://github.com/lab-tecnosocial/censosbo/blob/main/
    issue: https://github.com/lab-tecnosocial/censosbo/issues/
    user: https://github.com/

template:
  bootstrap: 5
  bslib:
    primary: "#003087"
    link-color: "#003087"
    heading-font: "Source Sans Pro"

home:
  title: "censosbo: Datos del Censo Bolivia 2024"
  description: >
    Acceso programático a los microdatos del Censo de Población y Vivienda
    2024 de Bolivia (CPV-2024). Descarga bajo demanda, caché local,
    compatible con dplyr, Arrow y DuckDB.
  sidebar:
    structure: [links, license, community, citation, authors, dev]
  links:
  - text: "Fuente de datos: INE Bolivia"
    href: https://anda.ine.gob.bo/index.php/catalog/132
  - text: "Reportar un problema"
    href: https://github.com/lab-tecnosocial/censosbo/issues

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Empezar
      href: articles/introduccion.html
    articles:
      text: Artículos
      menu:
      - text: "Introducción al paquete"
        href: articles/introduccion.html
      - text: "Diccionario de datos"
        href: articles/diccionario.html
      - text: "---"
      - text: "Tutoriales"
      - text: "Análisis demográfico"
        href: articles/analisis-demografico.html
      - text: "Análisis de condiciones de vivienda"
        href: articles/analisis-vivienda.html
      - text: "Análisis avanzado con DuckDB y Arrow"
        href: articles/analisis-avanzado.html

footer:
  structure:
    left: developed_by
    right: built_with

reference:
  - title: "Acceso a microdatos"
    desc: >
      Funciones principales para descargar y consultar los cuatro conjuntos
      de datos del CPV-2024. Todos devuelven un Arrow Dataset (lazy),
      un tibble, o una conexión DuckDB.
    contents:
      - get_personas
      - get_viviendas
      - get_emigracion
      - get_mortalidad
  - title: "Datos incluidos en el paquete"
    desc: >
      Datasets pequeños disponibles sin descarga, para exploración y prototipado.
    contents:
      - geo_bolivia
      - codebook_meta
      - sample_personas
  - title: "Geografía de Bolivia"
    desc: >
      Funciones para consultar la división político-administrativa del país
      (9 departamentos, 113 provincias, 343 municipios).
    contents:
      - departamentos
      - provincias
      - municipios
  - title: "Diccionario de variables y etiquetas"
    desc: >
      Funciones para explorar las 168 variables del CPV-2024,
      consultar categorías y convertir códigos numéricos a etiquetas legibles.
    contents:
      - codebook
      - codebook_valores
      - etiquetar
  - title: "Gestión de caché"
    desc: >
      Los archivos Parquet se descargan una sola vez y quedan en caché local.
      Estas funciones permiten inspeccionar y limpiar el caché.
    contents:
      - censosbo_cache_dir
      - censosbo_cache_info
      - censosbo_cache_clear
  - title: "Información del paquete"
    contents:
      - censosbo-package

articles:
  - title: "Primeros pasos"
    navbar: ~
    contents:
      - introduccion
      - diccionario
  - title: "Tutoriales"
    navbar: Tutoriales
    contents:
      - analisis-demografico
      - analisis-vivienda
      - analisis-avanzado
