url: https://lab-tecnosocial.github.io/censosbo/

template:
  bootstrap: 5
  bslib:
    primary: "#003087"
    link-color: "#003087"
    navbar-bg: "#003087"
    footer-bg: "#003087"

home:
  title: "censosbo: Datos del Censo Bolivia 2024"
  description: >
    Acceso programático a los microdatos del Censo de Población y Vivienda
    2024 de Bolivia (CPV-2024). Descarga bajo demanda, caché local,
    compatible con dplyr, Arrow y DuckDB.
  links:
  - text: "Fuente de datos: INE Bolivia"
    href: https://anda.ine.gob.bo/index.php/catalog/132

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [github]
  components:
    intro:
      text: Empezar
      href: articles/introduccion.html

footer:
  structure:
    left: developed_by
    right: built_with

reference:
  - title: "Datos del censo"
    desc: "Funciones para descargar y acceder a los microdatos del CPV-2024."
    contents:
      - get_personas
      - get_viviendas
      - get_emigracion
      - get_mortalidad
  - title: "Geografía de Bolivia"
    desc: "Tablas y funciones con la división política del país."
    contents:
      - geo_bolivia
      - departamentos
      - provincias
      - municipios
  - title: "Diccionario de variables"
    desc: "Funciones para explorar las variables disponibles en cada tabla."
    contents:
      - codebook_meta
      - codebook
      - codebook_valores
  - title: "Gestión de caché"
    desc: "Funciones para administrar los archivos descargados localmente."
    contents:
      - censosbo_cache_dir
      - censosbo_cache_info
      - censosbo_cache_clear
  - title: "Paquete"
    contents:
      - censosbo-package

articles:
  - title: "Tutoriales"
    navbar: ~
    contents:
      - introduccion
      - analisis-demografico
      - analisis-vivienda
      - analisis-avanzado
