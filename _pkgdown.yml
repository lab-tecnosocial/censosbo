reference:
  - title: "Diccionario de variables"
    desc: >
      Funciones para explorar variables y etiquetas de todos los censos,
      y para convertir códigos numéricos a texto legible.
    contents:
      - codebook
      - codebook_valores
      - codebook_docs
      - censo_temas
      - vars_tema
      - codebook_1976
      - codebook_1992
      - codebook_2001
      - codebook_2012
      - codebook_2024
      - etiquetar_valores
      - etiquetar_variables
      - etiquetar_geografia

  - title: "CPV-2024: microdatos"
    desc: >
      Funciones para descargar y consultar los microdatos del Censo de
      Población y Vivienda 2024. Todos devuelven un Arrow Dataset (lazy),
      un tibble, o una conexión DuckDB.
    contents:
      - get_personas_2024
      - get_viviendas_2024
      - get_emigracion_2024
      - get_mortalidad_2024
      - tipos_vivienda

  - title: "CPV-2024: manzanos y comunidades"
    desc: >
      Datos agregados del Censo 2024 por unidad censal (manzano urbano y
      comunidad rural), el nivel geográfico más fino disponible: 268.604
      unidades frente a los 343 municipios de los microdatos.
    contents:
      - get_unidades_2024
      - get_fichas_2024
      - get_geo_manzanos
      - get_geo_comunidades

  - title: "Censos históricos: API general"
    desc: >
      Función principal para acceder a cualquier censo histórico (1976,
      1992, 2001, 2012) y funciones de análisis temporal entre censos.
    contents:
      - get_censo
      - get_temporal
      - get_temporal_vivienda
      - variables_armonizadas
      - grupos_variables

  - title: "Censos históricos: atajos por año"
    desc: >
      Funciones cortas equivalentes a `get_censo(anio, tabla, ...)`.
    contents:
      - get_poblacion_1976
      - get_viviendas_1976
      - get_personas_1992
      - get_viviendas_1992
      - get_mortalidad_1992
      - get_personas_2001
      - get_viviendas_2001
      - get_personas_2012
      - get_viviendas_2012
      - get_emigracion_2012
      - get_discapacidad_2012


  - title: "Reproducir los tabulados oficiales"
    desc: >
      Los cuadros publicados por el INE se calculan sobre un universo más
      estrecho que el de los microdatos: una edad mínima y solo residentes
      habituales en el país. Sin ese recorte las cifras no cuadran aunque el
      cálculo sea correcto.
    contents:
      - universo_ine

  - title: "Geografía y visualización en mapas"
    desc: >
      Funciones para consultar la división político-administrativa del país
      y para generar mapas coropléticos con variables censales.
    contents:
      - departamentos
      - provincias
      - municipios
      - mapa_dep
      - mapa_mun
      - mapa_man

  - title: "Gestión de caché"
    desc: >
      Los archivos Parquet se descargan una sola vez y quedan en caché local.
    contents:
      - censosbo_cache_dir
      - censosbo_cache_info
      - censosbo_cache_clear

  - title: "Datos incluidos en el paquete"
    desc: >
      Datasets disponibles sin descarga, incluidos directamente en el paquete.
    contents:
      - codebook_meta
      - codebook_historico_meta
      - codebook_docs_meta
      - censo_temas_meta
      - censo_bloques_meta
      - variable_temporal_map
      - geo_bolivia
      - geo_departamentos
      - geo_municipios

  - title: "Información del paquete"
    contents:
      - censosbo-package

# Los artículos que viven en vignettes/articles/ se referencian con el prefijo
# `articles/`: son solo-web y no viajan en el paquete (ver .Rbuildignore), así que
# CRAN no los reconstruye. Solo `introduccion` y `temas` son viñetas de verdad.
# Si se mueve un .Rmd entre vignettes/ y vignettes/articles/, hay que cambiar su
# entrada aquí o pkgdown aborta con "must be a known topic name" — R CMD check no
# ve nada raro.
articles:
  - title: "Primeros pasos"
    navbar: ~
    contents:
      - introduccion
      - temas
      - articles/diccionario
  - title: "CPV-2024"
    navbar: Tutoriales
    contents:
      - articles/analisis-demografico
      - articles/analisis-vivienda
      - articles/manzanos-comunidades
      - articles/analisis-avanzado
  - title: "Censos históricos"
    navbar: Censos históricos
    contents:
      - articles/censos-historicos
      - articles/analisis-temporal
  - title: "Mapas y visualización"
    navbar: Mapas
    contents:
      - articles/visualizacion-mapas


