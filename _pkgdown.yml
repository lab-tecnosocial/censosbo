  bootstrap: 5
  lang: es
  bslib:
    primary: "#003087"
    link-color: "#003087"
    heading-font: "Source Sans Pro"

home:
  title: "censosbo: Censos de Bolivia (1976–2024)"
  description: >
    Acceso programático a los microdatos de los censos de Bolivia:
    1976, 1992, 2001, 2012 y CPV-2024. Descarga bajo demanda, caché local,
    compatible con dplyr, Arrow y DuckDB. Incluye diccionarios de variables
    para todos los años, funciones de análisis
    temporal y generación de mapas.
  sidebar:
    structure: [links, license, community, citation, authors, dev]
  links:
  - text: "Fuente de datos: INE Bolivia"
    href: https://anda.ine.gob.bo
  - text: "Reportar un problema"
    href: https://github.com/lab-tecnosocial/censosbo/issues

